[build-system]
requires = ["setuptools>=42", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "zephyrex-vtt"
version = "0.1.0"
description = "Zephyrex VTT: maps, scenes, tokens, sheets, dice, combat, live play"
requires-python = ">=3.11"
dependencies = [
    # rpg_state widens the framework's genealogy extension. The framework's
    # public 0.0.x releases on PyPI.
    "zephyrex[genealogy]~=0.0.1",
]

[project.optional-dependencies]
dev = [
    "pytest",
    "pytest-asyncio",
    "pytest-xdist",
]
