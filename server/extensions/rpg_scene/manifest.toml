# SPDX-License-Identifier: AGPL-3.0-or-later
name = "rpg_scene"
version = "0.1.0"
description = "Scenes, tokens and walls, and what each token perceives"
entry_module = "EXT_RPGScene"
minimum_framework_version = "0.0.1"
# Where this extension's source is offered (AGPL-3.0 section 13).
repository = "https://github.com/JamesonRGrieve/zephyrex-vtt"

# A scene belongs to a campaign, and a token stands for one of its characters
[[extension_dependencies]]
name = "rpg_core"
optional = false

# A scene and its regions are the wiki's locations on a map
[[extension_dependencies]]
name = "world_spatial"
optional = false

# A token stands for one of genealogy's persons
[[extension_dependencies]]
name = "genealogy"
optional = false
