# SPDX-License-Identifier: AGPL-3.0-or-later
name = "rpg_state"
version = "0.1.0"
description = "Narrative hooks and faction endpoints on relationships, until the wiki takes them"
entry_module = "EXT_RPGState"
minimum_framework_version = "0.0.1"
# Where this extension's source is offered (AGPL-3.0 section 13).
repository = "https://github.com/JamesonRGrieve/zephyrex-vtt"

# It widens genealogy's relationships with faction endpoints
[[extension_dependencies]]
name = "genealogy"
optional = false

# A hook belongs to a campaign
[[extension_dependencies]]
name = "rpg_core"
optional = false

# Faction hooks and endpoints name the wiki's factions
[[extension_dependencies]]
name = "world_social"
optional = false
